  :root { color-scheme: dark; }

  .editor-side { position: absolute; top: 54px; right: 0; bottom: 56px; width: min(320px, 48vw); overflow: auto; padding: 8px 10px;

  .editor-side h2 { font-size: 15px; margin: 0 0 8px; }
  .editor-side button { min-height: 44px; padding: 6px 10px; border-radius: 8px; border: 1px solid #3a5230; background: #24351b; color: #eaf3e6;
    cursor: pointer; text-align: left; }
  .editor-side button:disabled { opacity: .45; }
  .editor-side button.primary { background: #2f6fd6; border-color: #7fb0ff; width: 100%; }

  .editor-side .issues button { border-color: #b8453c; }

  .editor-side small { display: block; color: #a9c39c; }
  .editor-status { position: absolute; left: 8px; bottom: 8px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #6fc04a;
