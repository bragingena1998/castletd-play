<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10221a" />
    <title>CastleTD</title>
    <style>
      /* ===================================================================
       * S1 (docs/06_ROADMAP.md Block 4): единая система стилей проекта.
       * Источник цветов — docs/design/STYLE_GUIDE.md. src/ui/theme.ts и
       * src/ui/components.ts ссылаются на эти переменные через var(), а не
       * хранят цифры повторно — один источник правды на весь интерфейс.
       *
       * Шрифт: локальных файлов в public/assets/fonts нет (не скачивались —
       * см. docs/archive/00_STATE.md), поэтому по правилу задачи используется
       * системный стек с широкой поддержкой кириллицы, без интернет-CDN —
       * игра работает офлайн.
       * =================================================================== */
      :root {
        /* Палитра — STYLE_GUIDE.md */
        --c-bg: #10221a;
        --c-bg-soft: #16291f;
        --c-panel: rgba(19, 39, 29, 0.94);
        --c-panel-alt: rgba(255, 255, 255, 0.06);
        --c-panel-border: rgba(255, 255, 255, 0.12);
        --c-grass: #4fa83d;
        --c-grass-dark: #3b7f2e;
        --c-sand: #e6cfa3;
        --c-stone: #b9b2a6;
        --c-stone-dark: #6e685e;
        --c-accent: #2f6fed;
        --c-accent-light: #4f8bff;
        --c-gold: #f2c14e;
        --c-danger: #e04b3f;
        --c-success: #3fd17a;
        --c-text: #eaf5ea;
        --c-text-muted: #9db3a6;
        --c-scrim: rgba(6, 14, 10, 0.6);

        /* Отступы */
        --sp-1: 4px;
        --sp-2: 8px;
        --sp-3: 12px;
        --sp-4: 16px;
        --sp-5: 20px;
        --sp-6: 24px;
        --sp-7: 32px;

        /* Скругления */
        --r-sm: 8px;
        --r-md: 12px;
        --r-lg: 16px;
        --r-xl: 20px;
        --r-pill: 999px;

        /* Тени */
        --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
        --shadow-glow-gold: 0 0 16px rgba(242, 193, 78, 0.55);
        --shadow-glow-accent: 0 0 16px rgba(79, 139, 255, 0.5);

        /* Длительности анимаций */
        --d-fast: 120ms;
        --d-base: 150ms;
        --d-modal: 180ms;
        --d-slow: 280ms;

        /* Шрифт: системный гротеск, полная поддержка кириллицы на всех
           платформах, без внешних загрузок. */
        --font-sans:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--c-bg);
        color: var(--c-text);
        font-family: var(--font-sans);
        touch-action: none;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        left: 0;
        top: 0;
        transform: none;
        /* D-018: battle and menus use the whole landscape viewport. */
        /* main.ts still calls the legacy portrait helper during the transition; the
           important rule prevents that inline compatibility value from shrinking the
           actual landscape shell. */
        width: 100vw !important;
        height: 100vh;
        overflow: hidden;
        background: var(--c-bg);
      }
      *, *::before, *::after { box-sizing: border-box; }
      /* Сброс нативного вида интерактивных элементов — иначе iOS подсвечивает
         тап синей вспышкой и рисует свои рамки поверх наших стилей. */
      button,
      input {
        font-family: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      button {
        -webkit-user-select: none;
        user-select: none;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
      }

      /* S4: общие ключевые кадры анимаций — переиспользуются во всех экранах
         через src/ui/theme.ts (animation helper). Длительности небольшие
         (150-220мс), тяжёлых эффектов нет — не тормозит на телефоне. */
      @keyframes ctd-fade-in-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes ctd-scale-in {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes ctd-pop {
        0% {
          opacity: 0;
          transform: scale(0.3) rotate(-8deg);
        }
        60% {
          opacity: 1;
          transform: scale(1.18) rotate(3deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }
      @keyframes ctd-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.06);
          opacity: 0.85;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/main-CdXD19GF.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
