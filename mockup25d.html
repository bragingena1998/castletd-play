<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CastleTD — макет 2.5D</title>
<style>
  html, body { margin: 0; height: 100%; background: #1f3a1c; overflow: hidden; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
  #tag { position: fixed; left: 8px; top: 8px; font: 600 12px system-ui, sans-serif; color: #fff;
         background: rgba(0,0,0,.45); padding: 4px 8px; border-radius: 8px; }
</style>
</head>
<body>
<div id="tag">Макет 2.5D · только вид, без игры</div>
<canvas id="c"></canvas>
<script>
(() => {
  const COLS = 8, ROWS = 13;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const names = ['grass','dirt','trees_1','rocks_1','castle','archers_1','ballista_1','enemy_grunt'];
  const img = {};
  let loaded = 0;
  names.forEach(n => {
    const i = new Image();
    i.onload = () => { if (++loaded === names.length) start(); };
    i.onerror = () => { if (++loaded === names.length) start(); };
    i.src = 'assets/sprites/sprite_' + n + '.png';
    img[n] = i;
  });

  // Route through cell centres: spawn top-right, winding down to the castle bottom-left.
  const route = [[6,-1],[6,2],[3,2],[3,5],[5,5],[5,8],[2,8],[2,11],[3,11],[3,12.4]];
  const towers = [
    { x: 4, y: 3, s: 'archers_1' }, { x: 2, y: 4, s: 'ballista_1' },
    { x: 4, y: 7, s: 'archers_1' }, { x: 1, y: 10, s: 'ballista_1' }, { x: 6, y: 6, s: 'ballista_1' },
  ];
  const decor = [
    { x: -0.3, y: 1, s: 'trees_1', k: 1.7 }, { x: -0.4, y: 6.5, s: 'trees_1', k: 1.8 },
    { x: 7.4, y: 3.5, s: 'trees_1', k: 1.7 }, { x: 7.3, y: 10, s: 'trees_1', k: 1.9 },
    { x: 0.5, y: -0.2, s: 'rocks_1', k: 1.3 }, { x: 7.2, y: 12.3, s: 'rocks_1', k: 1.2 },
    { x: 6.2, y: 10.5, s: 'rocks_1', k: 1.0 }, { x: 0.3, y: 12.6, s: 'trees_1', k: 1.5 },
    { x: 4.8, y: -0.3, s: 'rocks_1', k: 1.1 }, { x: 7.3, y: -0.1, s: 'trees_1', k: 1.6 },
  ];

  let cell = 40, ox = 0, oy = 0, W = 0, H = 0, dpr = 1;
  let grassPat = null, dirtPat = null;
  const segs = [];
  let routeLen = 0;

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cell = Math.min(W / COLS, H / ROWS);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ox = (W - cell * COLS) / 2; oy = (H - cell * ROWS) / 2;
    grassPat = makePattern(img.grass, cell * 3);
    dirtPat = makePattern(img.dirt, cell * 2.2);
    segs.length = 0; routeLen = 0;
    for (let i = 0; i < route.length - 1; i++) {
      const a = P(route[i]), b = P(route[i + 1]);
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      segs.push({ a, b, len, from: routeLen }); routeLen += len;
    }
  }
  function P([cx, cy]) { return { x: ox + (cx + 0.5) * cell, y: oy + (cy + 0.5) * cell }; }
  function makePattern(image, size) {
    if (!image.naturalWidth) return null;
    const off = document.createElement('canvas');
    off.width = off.height = Math.max(8, Math.round(size * dpr));
    off.getContext('2d').drawImage(image, 0, 0, off.width, off.height);
    return ctx.createPattern(off, 'repeat');
  }
  function pointAt(d) {
    d = ((d % routeLen) + routeLen) % routeLen;
    for (const s of segs) if (d <= s.from + s.len) {
      const t = (d - s.from) / s.len;
      return { x: s.a.x + (s.b.x - s.a.x) * t, y: s.a.y + (s.b.y - s.a.y) * t, dx: s.b.x - s.a.x };
    }
    const s = segs[segs.length - 1];
    return { x: s.b.x, y: s.b.y, dx: 1 };
  }

  function drawGround() {
    ctx.fillStyle = grassPat || '#5cae3a';
    ctx.fillRect(0, 0, W, H);
    // soft vignette outside the playfield so the board reads as a place, not a floating square
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(10,30,5,0.45)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // path: dark soft border, then the dirt itself, then a light worn centre
    const pts = route.map(P);
    const stroke = (width, style, blur) => {
      ctx.save();
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.lineWidth = width; ctx.strokeStyle = style;
      if (blur) { ctx.shadowColor = 'rgba(40,25,5,0.55)'; ctx.shadowBlur = blur; }
      ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
      for (const p of pts.slice(1)) ctx.lineTo(p.x, p.y);
      ctx.stroke(); ctx.restore();
    };
    stroke(cell * 1.02, 'rgba(92,62,28,0.55)', cell * 0.35);
    stroke(cell * 0.9, dirtPat || '#c89a5a');
    stroke(cell * 0.35, 'rgba(255,235,190,0.10)');
  }

  function shadow(x, y, w) {
    ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(x, y, w * 0.42, w * 0.14, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  function sprite(name, x, baseY, size, flip, squash) {
    const im = img[name]; if (!im.naturalWidth) return;
    const h = size * (squash || 1), w = size / Math.sqrt(squash || 1);
    ctx.save(); ctx.translate(x, baseY); if (flip) ctx.scale(-1, 1);
    ctx.drawImage(im, -w / 2, -h * 0.92, w, h); ctx.restore();
  }

  function start() { layout(); requestAnimationFrame(frame); }
  window.addEventListener('resize', layout);

  function frame(tms) {
    const t = tms / 1000;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawGround();
    const items = [];
    for (const d of decor) {
      const p = P([d.x, d.y]);
      items.push({ y: p.y + cell * 0.3, draw: () => { shadow(p.x, p.y + cell * 0.3, cell * d.k); sprite(d.s, p.x, p.y + cell * 0.35, cell * d.k); } });
    }
    const castle = P(route[route.length - 1]);
    items.push({ y: castle.y + cell * 0.6, draw: () => { shadow(castle.x, castle.y + cell * 0.55, cell * 2.2); sprite('castle', castle.x, castle.y + cell * 0.65, cell * 2.3); } });
    towers.forEach((tw, i) => {
      const p = P([tw.x, tw.y]);
      const recoil = Math.max(0, Math.sin(t * 2.2 + i * 1.7)) > 0.97 ? 0.94 : 1;
      items.push({ y: p.y + cell * 0.4, draw: () => { shadow(p.x, p.y + cell * 0.38, cell * 1.2); sprite(tw.s, p.x, p.y + cell * 0.45, cell * 1.45, false, recoil); } });
    });
    const speed = cell * 0.9;
    for (let i = 0; i < 7; i++) {
      const d = t * speed - i * cell * 1.1;
      if (d < 0) continue;
      const p = pointAt(d);
      const step = Math.sin(t * 10 + i);
      const squash = 1 + step * 0.05;
      items.push({ y: p.y, draw: () => { shadow(p.x, p.y + cell * 0.08, cell * 0.8); sprite('enemy_grunt', p.x, p.y + cell * 0.1 - Math.abs(step) * cell * 0.06, cell * 0.85, p.dx < 0, squash); } });
    }
    items.sort((a, b) => a.y - b.y).forEach(it => it.draw());
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
