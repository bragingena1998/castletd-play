<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CastleTD — просмотр картинок</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: #1b2a17; color: #eaf3e6; display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
  body.dragging { outline: 4px dashed #8fd06a; outline-offset: -8px; }
  #scene { width: 100%; height: 100%; display: block; }
  aside { padding: 14px; overflow: auto; background: #16210f; border-left: 1px solid #2c3f22; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  button, select, label.file { background: #24351b; color: #eaf3e6; border: 1px solid #3a5230; border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 13px; }
  button.on { background: #4f8f33; border-color: #6fc04a; }
  ul { padding-left: 18px; margin: 8px 0; }
  li { margin-bottom: 4px; }
  .hint { color: #a9c39c; font-size: 12px; }
  input[type=file] { display: none; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }
</style>
  <script type="module" crossorigin src="./assets/art-viewer-yq0qrWPl.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body>
<canvas id="scene"></canvas>
<aside>
  <h1>Просмотр картинки в игре</h1>
  <p class="hint">Перетащи PNG в окно — увидишь его на поле в настоящем размере и с той же анимацией, что в игре. Файл никуда не отправляется.</p>
  <div class="row">
    <label class="file">Выбрать файл<input id="pick" type="file" accept=".png,.json" multiple></label>
    <select id="kind" title="Тип объекта">
      <option value="auto">определить по имени</option>
      <option value="tower">башня</option>
      <option value="enemy">враг</option>
      <option value="hero">герой</option>
      <option value="castle">замок</option>
      <option value="decor">декор</option>
      <option value="terrain">текстура земли</option>
    </select>
  </div>
  <div class="row">
    <button data-state="idle">стоит</button>
    <button data-state="walk" class="on">идёт</button>
    <button data-state="attack">бьёт</button>
    <button data-state="hit">получает урон</button>
    <button data-state="die">умирает</button>
  </div>
  <div class="row">
    <select id="compare">
      <option value="single">один, рядом с башней и героем</option>
      <option value="crowd">толпа из 20</option>
    </select>
    <button id="copy">Скопировать отчёт</button>
  </div>
  <div id="report" class="hint">Пока ничего не открыто.</div>
  <p class="hint">Требования к файлам — <code>art/SPEC.md</code>. Заказы — <code>art/REQUESTS.md</code>.</p>
</aside>
</body>
</html>
