<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CastleTD — просмотр графики</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#14251a;color:#f8f2df;font:14px system-ui,sans-serif}body{display:grid;grid-template-rows:auto 1fr}.bar{display:flex;gap:12px;align-items:center;padding:10px 14px;background:#203c28;flex-wrap:wrap}.bar label{font-weight:700}.bar select,.bar button{background:#f6e3a7;color:#20331e;border:0;border-radius:6px;padding:7px}.hint{opacity:.8;font-size:12px}#stage{position:relative;min-height:calc(100vh - 65px);overflow:hidden;background:linear-gradient(145deg,#599d43,#2f6a35)}#stage.phone{width:844px;height:390px;min-height:390px;margin:18px auto;border:8px solid #111;border-radius:24px}canvas{width:100%;height:100%;display:block}.drop{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#fff;text-align:center;font-size:18px;font-weight:800;text-shadow:0 2px 3px #000}.drop span{background:#132719b8;padding:10px 14px;border-radius:8px}.warn{color:#ffd975;font-weight:700}@media(max-width:880px){#stage.phone{width:100%;margin:0;border:0;border-radius:0}}
</style></head><body><div class="bar"><label>Тип <select id="type"></select></label><button id="phone">Телефон 844×390</button><button id="large">Крупно</button><span id="status" class="hint">Перетащите PNG, папку *_rig или PNG+ Aseprite JSON.</span></div><main id="stage"><canvas id="scene"></canvas><div class="drop" id="drop"><span>Перетащите сюда образец<br><small>Файлы останутся только в вашем браузере</small></span></div></main><script>
const stage=document.querySelector('#stage'), canvas=document.querySelector('#scene'), ctx=canvas.getContext('2d'), picker=document.querySelector('#type'), status=document.querySelector('#status'), drop=document.querySelector('#drop');let assets=[], image=null, rigParts=[], frameTags=[], start=performance.now();
fetch('../art/manifest.json').then(r=>r.json()).then(m=>{assets=m.assets;for(const a of assets){const o=document.createElement('option');o.value=a.file;o.textContent=`${a.description} (${a.file})`;picker.append(o)}const wanted=new URLSearchParams(location.search).get('type');if(wanted)picker.value=wanted}).catch(()=>status.textContent='Сначала выполните npm run art:manifest.');
document.querySelector('#phone').onclick=()=>stage.classList.add('phone');document.querySelector('#large').onclick=()=>stage.classList.remove('phone');
function size(){const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();
function selected(){return assets.find(a=>a.file===picker.value)||{sizeInGame:1,group:'enemy'}}
function testImage(img,file){const a=selected(), issues=[];if(img.width!==img.height||img.width<1024)issues.push('Нужен квадратный холст ≥1024 px');if(file&&a.file.startsWith('terrain_'))issues.push('Terrain проверяется при приёмке: без альфы');return issues}
function read(file){const reader=new FileReader();reader.onload=e=>{const i=new Image();i.onload=()=>{image=i;rigParts=[];const issues=testImage(i,file);status.innerHTML=issues.length?`<span class="warn">${issues.join('. ')}</span>`:'✓ Размер принят для предпросмотра; приёмщик проверит альфу, края и имя.';drop.style.display='none'};i.src=e.target.result};reader.readAsDataURL(file)}
const sample=new URLSearchParams(location.search).get('sample');if(sample){const i=new Image();i.onload=()=>{image=i;status.textContent='Демонстрационный образец в поле; обычный файл так же остаётся только в браузере.';drop.style.display='none'};i.src=sample}
stage.addEventListener('dragover',e=>{e.preventDefault();drop.style.background='#ffffff22'});stage.addEventListener('dragleave',()=>drop.style.background='');stage.addEventListener('drop',async e=>{e.preventDefault();drop.style.background='';const files=[...e.dataTransfer.files];const png=files.find(f=>f.name.endsWith('.png'));const json=files.find(f=>f.name.endsWith('.json'));if(json){try{const data=JSON.parse(await json.text());frameTags=data.meta?.frameTags||[];if(!frameTags.length)status.innerHTML='<span class="warn">В Aseprite JSON нет frameTags.</span>'}catch{status.innerHTML='<span class="warn">JSON не читается.</span>'}}if(png)read(png);else status.innerHTML='<span class="warn">Нужен PNG (для листа — вместе с JSON).</span>'});
function sprite(i,x,y,s,flip=false){if(!i)return;const ratio=i.width/i.height;ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.drawImage(i,-s*ratio/2,-s*.95,s*ratio,s);ctx.restore()}
function loop(now){const w=canvas.width/(Math.min(devicePixelRatio,2)),h=canvas.height/(Math.min(devicePixelRatio,2)),t=(now-start)/1000;ctx.clearRect(0,0,w,h);ctx.fillStyle='#579b42';ctx.fillRect(0,0,w,h);const cell=Math.min(w/12,h/6), y=h*.56;ctx.strokeStyle='#8a6537';ctx.lineWidth=cell*.8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-20,y);ctx.bezierCurveTo(w*.3,y-cell,w*.6,y+cell,w+20,y-cell*.2);ctx.stroke();ctx.strokeStyle='#c59a58';ctx.lineWidth=cell*.59;ctx.stroke();ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(w*.52,h*.75,cell*.6,cell*.13,0,0,7);ctx.fill();const a=selected(), s=cell*a.sizeInGame;const bob=a.group==='enemy'?Math.sin(t*9)*cell*.05:0;sprite(image,w*.52,h*.75+bob,s,a.group==='enemy');if(image&&a.group==='enemy'){ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillText(frameTags.length?`Тег: ${frameTags[Math.floor(t*3)%frameTags.length].name}`:'Уровень 0: ходьба движком',14,25)}ctx.fillStyle='#eee';ctx.fillText('Тень и масштаб — как в игре',14,h-14);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
